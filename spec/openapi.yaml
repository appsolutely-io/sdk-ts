openapi: 3.1.0
info:
  title: 'Laravel public API'
  version: v1
  description: 'The public developer API of this install, major version v1 (current). Every path here is stable for the life of the version: fields are added, never removed or retyped, and a breaking change arrives as a new version while this one keeps serving. A create a retry could repeat takes an `Idempotency-Key` header: a structured-field String or a bare token of 1 to 255 characters, chosen by the client per request. The same key with the same request answers the first outcome again, with `Idempotent-Replayed: true`; with a different request it is refused. A duplicate sent while the first is still running waits for it for up to 20 seconds, then is answered `409` `idempotency-key-in-use` with `Retry-After` and should be sent again, as is any request whose key could not be claimed in that time; a create whose own write waits on a lock longer than the database allows a statement is answered `503` `temporarily-unavailable` with `Retry-After` at once, without being run again. Neither spends the key. A key is honoured for 24 hours, then is a new key.'
servers:
  - url: /
tags:
  - name: account-states
  - name: articles
  - name: form-entries
  - name: magic-link
  - name: me
  - name: me-addresses
  - name: me-billing-entry
  - name: me-entitlements
  - name: me-orders
  - name: me-push-devices
  - name: me-referral
  - name: orders
  - name: pages
  - name: products
  - name: sync.articles
  - name: sync.form-entries
  - name: sync.me-addresses
  - name: sync.me-orders
  - name: sync.orders
  - name: sync.pages
  - name: sync.products
  - name: version
  - name: webhook-deliveries
paths:
  /api/v1:
    get:
      operationId: getApiVersion
      tags:
        - version
      summary: 'The lifecycle of this API version'
      responses:
        200:
          description: OK
          headers:
            Deprecation:
              description: 'Once this version is deprecated: since when, as `@<unix seconds>` (RFC 9745).'
              schema: { type: string }
            Sunset:
              description: 'Once this version has a retirement date: that date, as an HTTP-date (RFC 8594).'
              schema: { type: string }
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiVersion' }
        404:
          description: 'Refused: `not-found`.'
          content:
            application/problem+json:
              schema: { allOf: [{ $ref: '#/components/schemas/Problem' }, { properties: { type: { enum: ['https://appsolutely.io/problems/not-found'] } } }] }
          headers:
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        429:
          description: 'Refused: `rate-limited`.'
          headers:
            Retry-After:
              description: 'Seconds to wait before asking again.'
              schema: { type: string }
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/problem+json:
              schema: { allOf: [{ $ref: '#/components/schemas/Problem' }, { properties: { type: { enum: ['https://appsolutely.io/problems/rate-limited'] } } }] }
  /api/v1/account-states:
    get:
      operationId: listAccountStates
      tags:
        - account-states
      summary: 'List account states'
      responses:
        200:
          description: OK
