          type: array
          items:
            $ref: '#/components/schemas/FormEntry'
        tombstones:
          type: array
          items:
            $ref: '#/components/schemas/SyncTombstone'
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
        has_more:
          type: boolean
      required:
