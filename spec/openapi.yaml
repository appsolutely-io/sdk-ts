components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  headers:
    RateLimit:
      description: 'What is left of each budget that counted this request, one list member per policy: `"<policy>";r=<remaining>;t=<seconds until the window turns over>` (draft-ietf-httpapi-ratelimit-headers).'
      schema:
        type: string
    RateLimit-Policy:
      description: 'Each budget that counted this request, one list member per policy: `"<policy>";q=<quota>;w=<window in seconds>` (draft-ietf-httpapi-ratelimit-headers).'
      schema:
        type: string
    X-Request-Id:
      description: 'The id this request is logged under: the trace-id of a valid `traceparent` the request sent, otherwise one the server chose.'
      schema:
        type: string
  schemas:
    ApiVersion:
      type: object
      properties:
        version:
          type: string
        status:
          type: string
        deprecated_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        sunset_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        successor:
          oneOf:
            - type: string
            - type: 'null'
        documentation:
          oneOf:
            - type: string
            - type: 'null'
      required:
        - version
        - status
    Article:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          oneOf:
            - type: string
            - type: 'null'
        description:
          oneOf:
            - type: string
            - type: 'null'
        keywords:
          oneOf:
            - type: string
            - type: 'null'
        cover:
          description: 'The absolute URL the image is served at, built when the response is made, so it follows the address the site has then.'
          oneOf:
            - type: string
            - type: 'null'
        status:
          type: integer
        sort:
          oneOf:
            - type: integer
            - type: 'null'
        published_at:
          type: string
          format: date-time
        expired_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ArticleCategorySummary'
      required:
        - id
        - title
        - status
        - published_at
        - created_at
        - updated_at
        - categories
    ArticleCategorySummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          oneOf:
            - type: string
            - type: 'null'
      required:
        - id
        - title
    ArticleFeed:
      type: object
      properties:
        upserts:
          type: array
          items:
            $ref: '#/components/schemas/Article'
        tombstones:
          type: array
          items:
            $ref: '#/components/schemas/SyncTombstone'
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
        has_more:
          type: boolean
      required:
        - upserts
        - tombstones
        - has_more
    ArticlePage:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Article'
        next_cursor:
          type: string
          description: 'Pass as `cursor` for the next page. Absent on the last page.'
    BillingEntry:
      type: object
      properties:
        available:
          type: boolean
        wording:
          oneOf:
            - type: string
            - type: 'null'
        presentation:
          oneOf:
            - type: string
            - type: 'null'
        needs_store_token:
          oneOf:
            - type: boolean
            - type: 'null'
        url:
          oneOf:
            - type: string
            - type: 'null'
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - available
    FormEntry:
      type: object
      properties:
        id:
          type: string
        form:
