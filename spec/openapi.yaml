              schema: { allOf: [{ $ref: '#/components/schemas/Problem' }, { properties: { type: { enum: ['https://appsolutely.io/problems/unsupported-media-type'] } } }] }
        422:
          description: 'Refused: `validation-failed`, `mode-from-credential`, `idempotency-key-reused`.'
          content:
            application/problem+json:
              schema: { allOf: [{ $ref: '#/components/schemas/ValidationProblem' }, { properties: { type: { enum: ['https://appsolutely.io/problems/validation-failed', 'https://appsolutely.io/problems/mode-from-credential', 'https://appsolutely.io/problems/idempotency-key-reused'] } } }] }
          headers:
