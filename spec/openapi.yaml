          content:
            application/problem+json:
              schema: { allOf: [{ $ref: '#/components/schemas/ValidationProblem' }, { properties: { type: { enum: ['https://appsolutely.io/problems/validation-failed', 'https://appsolutely.io/problems/invalid-cursor', 'https://appsolutely.io/problems/mode-from-credential'] } } }] }
          headers:
            RateLimit:
              $ref: '#/components/headers/RateLimit'
