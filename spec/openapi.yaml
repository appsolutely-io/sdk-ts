            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/problem+json:
              schema: { allOf: [{ $ref: '#/components/schemas/Problem' }, { properties: { type: { enum: ['https://appsolutely.io/problems/unauthenticated', 'https://appsolutely.io/problems/invalid-token'] } } }] }
        403:
          description: 'Refused: `wrong-audience`, `insufficient-scope`.'
          content:
            application/problem+json:
              schema: { allOf: [{ $ref: '#/components/schemas/Problem' }, { properties: { type: { enum: ['https://appsolutely.io/problems/wrong-audience', 'https://appsolutely.io/problems/insufficient-scope'] } } }] }
          headers:
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimit-Policy'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        404:
          description: 'Refused: `not-found`.'
          content:
