components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ApiEnvelope:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: boolean
          const: true
        message:
          type: string
        data:
          description: 'Any JSON value: an object, a list or null. The route declares no resource shape.'
    ApiError:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: boolean
          const: false
        message:
          type: string
        error_class:
          type: string
        data:
          type:
            - object
            - 'null'
          additionalProperties: true
    Article:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          oneOf:
            - type: string
            - type: 'null'
        description:
          oneOf:
            - type: string
            - type: 'null'
        keywords:
          oneOf:
            - type: string
            - type: 'null'
        cover:
          description: 'The absolute URL the image is served at, built when the response is made, so it follows the address the site has then.'
          oneOf:
            - type: string
            - type: 'null'
        status:
          type: integer
        sort:
          oneOf:
            - type: integer
            - type: 'null'
        published_at:
          type: string
          format: date-time
        expired_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ArticleCategorySummary'
      required:
        - id
        - title
        - status
        - published_at
        - created_at
        - updated_at
        - categories
    ArticleCategorySummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          oneOf:
            - type: string
            - type: 'null'
      required:
        - id
        - title
    ArticleListResponse:
      type: object
      required:
        - status
        - message
        - data
        - meta
      properties:
        status:
          type: boolean
